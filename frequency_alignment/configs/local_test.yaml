# Local smoke profile for this machine:
# GPU: NVIDIA GeForce RTX 5070 Ti Laptop GPU (12 GB VRAM)
# Goal: verify the end-to-end pipeline with a recent small Qwen3-VL checkpoint.

seed: 42
deterministic: false
device: cuda:0
cache_dir: .hf_cache
out_dir: frequency_alignment_outputs_local

model:
  primary: Qwen/Qwen3-VL-2B-Instruct
  alternatives:
    - llava-hf/llava-v1.6-mistral-7b-hf
    - OpenGVLab/InternVL3-8B-hf
  quantization: null
  device_map: null
  attn_implementation: null
  attention_extract_implementation: eager
  trust_remote_code: true

data:
  dataset: gqa
  max_samples: 6
  allow_download: true
  seedbench_tsv: null
  seedbench_image_root: null
  clevr_dir: null
  clevr_split: val
  partimagenet_dir: null

perturbations:
  severity_levels:
    - 1
  # Save clean + all perturbation images for the first N successful samples per experiment. Use 0 to disable.
  export_num_images: 1
  # Overlay families are task-agnostic by default so the same nuisance text/box perturbations
  # are reused across the VQA levels without accidentally encoding answer labels.
  overlay_mode: label_free
  overlay_count: 3
  include_natural: true
  include_frequency: False
  # natural_types:
  #   - translation
  #   - padcrop
  #   - scale
  #   - scalepad_black
  #   - scalepad_white
  #   - rotation
  #   - gaussian_blur
  #   - motion_blur
  #   - occlusion
  #   - brightness
  #   - contrast
  #   - gaussian_noise
  #   - jpeg_compression
  #   - text_overlay
  #   - box_overlay
  #   - random_text
  natural_types:
    - translation
    - padcrop
    - scale
    - scalepad_black
    - scalepad_white
    - rotation
    - gaussian_blur
    - motion_blur
    - occlusion
    - brightness
    - contrast
    - gaussian_noise
    - jpeg_compression
    # - text_overlay
    # - box_overlay
    # - random_text
  frequency_types:
    - lowpass_keep
    - highpass_keep
    - lowband_noise
    - highband_noise
    - allband_noise
  severity_params:
    1:
      translate: 8
      padcrop: 8
      scale: 0.95
      rotation: 20
      freq_cutoff: 0.18
      freq_epsilon: 0.03137
      text_scale: 0.3
      gaussian_blur_radius: 1.0
      motion_blur_kernel: 3
      occlusion_fraction: 0.08
      brightness_delta: 0.15
      contrast_delta: 0.15
      gaussian_noise_std: 0.02
      jpeg_quality: 70

analysis:
  # Fallback manual band count. In auto mode the runner probes a few real images,
  # infers the model patch grid, and freezes one run-level count from the median grid.
  num_bands: 20
  num_bands_mode: auto
  num_bands_auto:
    probe_samples: 6
    coefficient: 0.6
    rounding: ceil
    statistic: median
    min_bands: 8
    max_bands: 16
  suppress_dc: false
  overlap_2d:
    enabled: true
  compute_l2_variants: false
  store_per_sample_filter_npy: false
  attention_layers: all
  # Set to hann / hamming to enable windowing, or none / off / false to disable it.
  attention_fft_window: none
  significance_level: 0.05
  hypothesis_testing: true

plotting:
  profile: exhaustive
  representative_samples: 10

experiments:
  exp1:
    enabled: true
    max_samples: 20
    # Vision-feature spectral path: disabled by default (sign-inverted vs pixel-space).
    extract_vision_tokens: false
    store_feature_delta_f: false
  exp2:
    enabled: true
    max_samples: 20
    layer_stride: 8
    # Overrides analysis.attention_fft_window. Use none / off / false to disable.
    fft_window: none
    question_only_control:
      enabled: false
    prompt_controls:
      - empty_language
      - random_language
  # exp3 (fusion drift) retired during camera-ready cleanup.
  exp4:
    enabled: true
    max_samples: 20
    sweep_steps: 5
  exp5:
    enabled: true
    primary_layer_group: late
    primary_delta_normalization: relative
  exp6:
    enabled: false
    max_samples: 3
    dataset: partimagenet
