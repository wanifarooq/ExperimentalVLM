# Local smoke profile for this machine:
# GPU: NVIDIA GeForce RTX 5070 Ti Laptop GPU (12 GB VRAM)
# Goal: verify the end-to-end pipeline with a recent small Qwen3-VL checkpoint.

seed: 42
deterministic: false
device: cuda:0
cache_dir: .hf_cache
out_dir: frequency_alignment_outputs_local

model:
  primary: Qwen/Qwen3-VL-2B-Instruct
  alternatives:
    - llava-hf/llava-v1.6-mistral-7b-hf
    - OpenGVLab/InternVL3-8B-hf
  quantization: null
  device_map: null
  attn_implementation: null
  attention_extract_implementation: eager
  trust_remote_code: true

data:
  dataset: gqa
  max_samples: 6
  allow_download: true
  seedbench_tsv: null
  seedbench_image_root: null
  partimagenet_dir: null

perturbations:
  severity_levels:
    - 1
  include_natural: true
  include_frequency: true
  natural_types:
    - translation
    - padcrop
    - scale
    - scalepad_black
    - scalepad_white
    - rotation
    - text_overlay
    - box_overlay
    - random_text
  frequency_types:
    - lowpass_keep
    - highpass_keep
    - lowband_noise
    - highband_noise
    - allband_noise
  severity_params:
    1:
      translate: 4
      padcrop: 4
      scale: 0.95
      rotation: 10
      freq_cutoff: 0.18
      freq_epsilon: 0.03137
      text_scale: 0.3

analysis:
  num_bands: 10
  attention_layers: all
  significance_level: 0.05
  hypothesis_testing: true

experiments:
  exp1:
    enabled: true
    max_samples: 5
    extract_vision_tokens: false
    store_feature_delta_f: true
  exp2:
    enabled: true
    max_samples: 5
    layer_stride: 8
  exp3:
    enabled: true
    max_samples: 5
    perturbation_subset: 3
  exp4:
    enabled: true
    max_samples: 5
    sweep_steps: 5
  exp5:
    enabled: true
  exp6:
    enabled: false
    max_samples: 3
    dataset: partimagenet
