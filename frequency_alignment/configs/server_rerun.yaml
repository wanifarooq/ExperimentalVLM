# Server follow-up after the 2026-04-22 500-sample smoke run.
# Differences vs server_severity1.yaml:
#   - perturbations.severity_levels: [1, 2, 3]  (Exp 4 ω_c* was pinned at Nyquist under severity 1 alone)
#   - experiments.exp6.enabled: false  (user keeps segmentation leg silent; matches prior-run CLI choice)
# DC convention: suppress_dc: false (DC ON), matching the canonical setting after the 2026-04-23
# 200-sample paired ablation (DC ON Exp 5 r=0.471 vs DC OFF r=0.055). The earlier suppress_dc: true
# experiment is retained only as a diagnostic ablation; do not use it as the production setting.
# Everything else mirrors default.yaml so the run remains comparable.
#
# Intended use:
#   python -m frequency_alignment.run_experiment --experiment all \
#     --config frequency_alignment/configs/server_rerun.yaml \
#     --max-samples 500

seed: 42
deterministic: false
device: cuda:0
cache_dir: .hf_cache
out_dir: frequency_alignment_outputs

model:
  primary: Qwen/Qwen3-VL-8B-Instruct
  alternatives:
    - Qwen/Qwen3-VL-2B-Instruct
    - Qwen/Qwen3-VL-8B-Instruct
    - llava-hf/llava-v1.6-mistral-7b-hf
    - OpenGVLab/InternVL3-8B-hf
  quantization: null
  device_map: auto
  attn_implementation: null
  attention_extract_implementation: eager
  trust_remote_code: true

data:
  dataset: gqa
  max_samples: 1000
  allow_download: true
  seedbench_tsv: null
  seedbench_image_root: null
  partimagenet_dir: null

perturbations:
  severity_levels:
    - 1
    - 2
    - 3
  export_num_images: 1
  overlay_mode: label_free
  overlay_count: 3
  include_natural: true
  include_frequency: true
  natural_types:
    - translation
    - padcrop
    - scale
    - scalepad_black
    - scalepad_white
    - rotation
    - gaussian_blur
    - motion_blur
    - occlusion
    - brightness
    - contrast
    - gaussian_noise
    - jpeg_compression
    - text_overlay
    - box_overlay
    - random_text
  frequency_types:
    - lowpass_keep
    - highpass_keep
    - lowband_noise
    - highband_noise
    - allband_noise
  severity_params:
    1:
      translate: 4
      padcrop: 4
      scale: 0.95
      rotation: 10
      freq_cutoff: 0.18
      freq_epsilon: 0.03137
      text_scale: 0.3
      gaussian_blur_radius: 1.0
      motion_blur_kernel: 3
      occlusion_fraction: 0.08
      brightness_delta: 0.15
      contrast_delta: 0.15
      gaussian_noise_std: 0.02
      jpeg_quality: 70
    2:
      translate: 8
      padcrop: 8
      scale: 0.90
      rotation: 20
      freq_cutoff: 0.28
      freq_epsilon: 0.03137
      text_scale: 0.5
      gaussian_blur_radius: 2.0
      motion_blur_kernel: 5
      occlusion_fraction: 0.14
      brightness_delta: 0.30
      contrast_delta: 0.30
      gaussian_noise_std: 0.04
      jpeg_quality: 50
    3:
      translate: 12
      padcrop: 12
      scale: 0.85
      rotation: 30
      freq_cutoff: 0.38
      freq_epsilon: 0.03137
      text_scale: 0.7
      gaussian_blur_radius: 3.0
      motion_blur_kernel: 7
      occlusion_fraction: 0.20
      brightness_delta: 0.45
      contrast_delta: 0.45
      gaussian_noise_std: 0.06
      jpeg_quality: 30

analysis:
  num_bands: 10
  num_bands_mode: auto
  num_bands_auto:
    probe_samples: 8
    coefficient: 0.6
    rounding: ceil
    statistic: median
    # min_bands lowered from 20 to 8: with min_bands=20 on Qwen3-VL's typical
    # 12×16 patch grid, several radial annuli are empty and the published W_t
    # contains visible alternating zeros every other bin. The √-rule + radial
    # cap in band_selection.py now resolve to ~9 naturally for that grid.
    min_bands: 10
    max_bands: 20
  suppress_dc: false
  overlap_2d:
    enabled: true
  # L1-normalised W_t only (paper convention). Set true to also persist L2.
  compute_l2_variants: false
  # Per-sample radial .npy sidecars (data also lives in power_spectra.json).
  store_per_sample_filter_npy: false
  attention_layers: all
  attention_fft_window: none
  significance_level: 0.05
  hypothesis_testing: true

plotting:
  profile: exhaustive
  representative_samples: 10

experiments:
  exp1:
    enabled: true
    max_samples: 1000
    # Vision-feature spectral path: disabled by default (sign-inverted vs pixel-space).
    extract_vision_tokens: true
    store_feature_delta_f: true
  exp2:
    enabled: true
    max_samples: 200
    layer_stride: 1
    fft_window: none
    question_only_control:
      enabled: true
    prompt_controls:
      - empty_language
      - random_language
  # exp3 (fusion drift) retired during camera-ready cleanup.
  exp4:
    enabled: true
    max_samples: 500
    sweep_steps: 20
    sweep_modes:
      - lowpass
      - highpass
  exp5:
    enabled: true
    primary_layer_group: last_2
    primary_delta_normalization: relative
  exp6:
    enabled: false
    max_samples: 300
    dataset: partimagenet
