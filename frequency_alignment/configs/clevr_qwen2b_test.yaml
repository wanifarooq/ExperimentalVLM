seed: 42
deterministic: false
device: cuda:0
cache_dir: .hf_cache
out_dir: frequency_alignment_outputs_clevr_qwen2b_test

model:
  primary: Qwen/Qwen3-VL-2B-Instruct
  alternatives: []
  quantization: null
  device_map: null
  attn_implementation: null
  attention_extract_implementation: eager
  trust_remote_code: true

data:
  dataset: clevr
  max_samples: 2
  allow_download: false
  clevr_dir: .hf_cache/clevr/CLEVR_v1.0
  clevr_split: val
  seedbench_tsv: null
  seedbench_image_root: null
  partimagenet_dir: null

perturbations:
  severity_levels:
    - 1
  export_num_images: 1
  overlay_mode: label_free
  overlay_count: 3
  include_natural: true
  include_frequency: false
  natural_types:
    - gaussian_blur
    - jpeg_compression
    - brightness
  frequency_types: []
  severity_params:
    1:
      translate: 8
      padcrop: 8
      scale: 0.95
      rotation: 20
      freq_cutoff: 0.18
      freq_epsilon: 0.03137
      text_scale: 0.3
      gaussian_blur_radius: 1.0
      motion_blur_kernel: 3
      occlusion_fraction: 0.08
      brightness_delta: 0.15
      contrast_delta: 0.15
      gaussian_noise_std: 0.02
      jpeg_quality: 70

analysis:
  num_bands: 12
  num_bands_mode: fixed
  suppress_dc: false
  overlap_2d:
    enabled: false
  compute_l2_variants: false
  store_per_sample_filter_npy: false
  attention_layers: all
  attention_fft_window: none
  significance_level: 0.05
  hypothesis_testing: true

plotting:
  profile: compact
  representative_samples: 2

experiments:
  exp1:
    enabled: true
    max_samples: 2
    extract_vision_tokens: false
    store_feature_delta_f: false
  exp2:
    enabled: false
    max_samples: 2
    layer_stride: 1
    fft_window: none
    question_only_control:
      enabled: false
    prompt_controls: []
  exp4:
    enabled: false
    max_samples: 2
    sweep_steps: 8
    sweep_modes:
      - lowpass
      - highpass
  exp5:
    enabled: false
    primary_layer_group: last_2
    primary_delta_normalization: relative
  exp6:
    enabled: false
