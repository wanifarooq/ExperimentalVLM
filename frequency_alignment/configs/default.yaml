# Server profile for 2x+ NVIDIA A100-class GPUs.
# Goal: publishable runs with a larger recent Qwen3-VL checkpoint and real drift metrics.

seed: 42
deterministic: false
device: cuda:0
cache_dir: .hf_cache
out_dir: frequency_alignment_outputs

model:
  primary: Qwen/Qwen3-VL-30B-A3B-Instruct
  alternatives:
    - Qwen/Qwen3-VL-8B-Instruct
    - llava-hf/llava-v1.6-mistral-7b-hf
    - OpenGVLab/InternVL3-8B-hf
  quantization: null
  device_map: auto
  attn_implementation: null
  attention_extract_implementation: eager
  trust_remote_code: true

data:
  dataset: gqa
  max_samples: 1000
  allow_download: true
  seedbench_tsv: null
  seedbench_image_root: null
  partimagenet_dir: null

perturbations:
  severity_levels:
    - 1
    - 2
    - 3
  include_natural: true
  include_frequency: true
  natural_types:
    - translation
    - padcrop
    - scale
    - scalepad_black
    - scalepad_white
    - rotation
    - text_overlay
    - box_overlay
    - random_text
  frequency_types:
    - lowpass_keep
    - highpass_keep
    - lowband_noise
    - highband_noise
    - allband_noise
  severity_params:
    1:
      translate: 4
      padcrop: 4
      scale: 0.95
      rotation: 10
      freq_cutoff: 0.18
      freq_epsilon: 0.03137
      text_scale: 0.3
    2:
      translate: 8
      padcrop: 8
      scale: 0.90
      rotation: 20
      freq_cutoff: 0.28
      freq_epsilon: 0.03137
      text_scale: 0.5
    3:
      translate: 12
      padcrop: 12
      scale: 0.85
      rotation: 30
      freq_cutoff: 0.38
      freq_epsilon: 0.03137
      text_scale: 0.7

analysis:
  num_bands: 10
  attention_layers: all
  significance_level: 0.05
  hypothesis_testing: true

experiments:
  exp1:
    enabled: true
    max_samples: 1000
    extract_vision_tokens: true
    store_feature_delta_f: true
  exp2:
    enabled: true
    max_samples: 200
    layer_stride: 2
  exp3:
    enabled: true
    max_samples: 200
    perturbation_subset: 10
  exp4:
    enabled: true
    max_samples: 500
    sweep_steps: 20
    sweep_modes:
      - lowpass
      - highpass
  exp5:
    enabled: true
  exp6:
    enabled: true
    max_samples: 300
    dataset: partimagenet
