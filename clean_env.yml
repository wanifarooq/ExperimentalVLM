name: vlm-robustness
channels:
  - conda-forge
dependencies:
  # Keep the conda side minimal and avoid pinning CUDA toolkits / compilers here.
  # GPU drivers are expected to be managed by the server.
  - python=3.10
  - pip
  - numpy
  - scipy
  - matplotlib
  - pillow
  - pyyaml
  - requests
  - pycocotools
  - pip:
      # Core VLM stack for frequency_alignment and the current Qwen/LLaVA/InternVL paths.
      - torch
      - torchvision
      - transformers>=4.57.0
      - accelerate

      # Optional only if you explicitly need them:
      # - bitsandbytes          # quantized loading
      # - segment-anything-2    # exp6 segmentation path
      # - pandas                # root-level vlm_invariance_check.py helpers
      # - scikit-learn          # PCA / t-SNE utilities in root scripts
